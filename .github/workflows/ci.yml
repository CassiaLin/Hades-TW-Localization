name: Hades-TW-Localization CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

      - name: Package & verify clean Public Release standalone
        shell: python
        run: |
          import subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix="hades_pub_ci_") as td:
              pub_dir = Path(td) / "Hades-TW-Localization"
              subprocess.run([sys.executable, "tools/package_public.py", "--out-dir", str(pub_dir), "--overwrite"], check=True)
              subprocess.run([sys.executable, "-m", "pytest", "-v"], cwd=str(pub_dir), check=True)
